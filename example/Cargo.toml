[package]
name = "crane-examples"
version = "0.1.0"
edition = "2021"

[dependencies]
crane = { path = "../crane" }
crane-core = { path = "../crane-core" }
anyhow = "1.0.100"
image = "0.25.9"
rustyline = "14.0.0"
serde_json = "1.0.140"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
base64 = "0.22"
hound = "3"
cpal = "0.18"

[[bin]]
name = "chat_simple"
path = "src/chat_simple.rs"

[[bin]]
name = "ornith_tools"
path = "src/ornith_tools.rs"

[[bin]]
name = "chat_streaming"
path = "src/chat_streaming.rs"

[[bin]]
name = "chat_cli"
path = "src/chat_cli.rs"

[[bin]]
name = "asr_simple"
path = "src/asr_simple.rs"

[[bin]]
name = "vision_simple"
path = "src/vision_simple.rs"

[[bin]]
name = "bm_resize"
path = "src/bm_resize.rs"

[[bin]]
name = "ocr_simple"
path = "src/ocr_simple.rs"

[[bin]]
name = "tts_simple"
path = "src/tts_simple.rs"

[[bin]]
name = "tts_custom_voice"
path = "src/tts_custom_voice.rs"

[[bin]]
name = "tts_voice_clone"
path = "src/tts_voice_clone.rs"

[[bin]]
name = "gemma4_simple"
path = "src/gemma4_simple.rs"

[[bin]]
name = "qwen3_5_vl_simple"
path = "src/qwen3_5_vl_simple.rs"

[[bin]]
name = "voxtral_tts_simple"
path = "src/voxtral_tts_simple.rs"

[[bin]]
name = "hunyuan_simple"
path = "src/hunyuan_simple.rs"

[[bin]]
name = "voxcpm2_simple"
path = "src/voxcpm2_simple.rs"

[[bin]]
name = "onnx_probe"
path = "src/onnx_probe.rs"

[[bin]]
name = "minicpmo_duplex_simple"
path = "src/minicpmo_duplex_simple.rs"

[features]
default = []
onnx = ["crane/onnx", "crane-core/onnx"]
metal = ["crane/metal", "crane-core/metal"]
accelerate = ["crane/accelerate", "crane-core/accelerate"]
cuda = ["crane/cuda", "crane-core/cuda"]
