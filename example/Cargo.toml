[package]
name = "crane-examples"
version.workspace = true
edition = "2021"

[dependencies]
# default-features = false on both, plus crane-core/default-backend below:
# see crane-serve/Cargo.toml's comment on the same pattern. Without it,
# `--no-default-features --features rocm` (or `sycl`) would still pull in
# the plain candle-core backend through these edges alongside the fork.
crane = { package = "crane-ai", version = "26.9.0", path = "../crane", default-features = false }
crane-core = { version = "26.9.0", path = "../crane-core", default-features = false }
anyhow = "1.0.100"
image = "0.25.9"
rustyline = "14.0.0"
serde_json = "1.0.140"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
base64 = "0.22"
hound = "3"
cpal = "0.18"
tokenizers = { workspace = true }

[[bin]]
name = "chat_simple"
path = "src/chat_simple.rs"

[[bin]]
name = "ornith_tools"
path = "src/ornith_tools.rs"

[[bin]]
name = "chat_streaming"
path = "src/chat_streaming.rs"

[[bin]]
name = "chat_cli"
path = "src/chat_cli.rs"

[[bin]]
name = "asr_simple"
path = "src/asr_simple.rs"

[[bin]]
name = "asr_qwen3_simple"
path = "src/asr_qwen3_simple.rs"

[[bin]]
name = "vision_simple"
path = "src/vision_simple.rs"

[[bin]]
name = "bm_resize"
path = "src/bm_resize.rs"

[[bin]]
name = "ocr_simple"
path = "src/ocr_simple.rs"

[[bin]]
name = "tts_simple"
