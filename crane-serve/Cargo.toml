[package]
name = "crane-serve"
version.workspace = true
description = "Fast, local-inference HTTP server for Crane Local AI"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "crane_serve"
path = "src/lib.rs"

[dependencies]
crane-core = { version = "26.9.0", path = "../crane-core", default-features = false }
crane = { package = "crane-ai", version = "26.9.0", path = "../crane", default-features = false }
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
# `env-filter` is already pulled in transitively via `ribo` (a `crane` dependency);
# declared explicitly here so `init_logging`'s use of `EnvFilter` doesn't depend on
# that staying true.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokenizers = { workspace = true }
reqwest = { version = "0.13", features = ["stream"] }
tempfile = "3"
image = "0.25"
base64 = "0.23"
subtle = "2"

[features]
# See `crane-core/Cargo.toml`'s `default-backend` comment: both `crane-core`
# and `crane`'s own defaults are disabled above so `rocm` (built with
# `--no-default-features`) doesn't drag in the plain candle backend
# alongside the fork.
default = ["crane-core/default-backend"]
metal = [
    "crane-core/metal",
    "crane/metal",
]
accelerate = [
    "crane-core/accelerate",
    "crane/accelerate",
]
onnx = ["crane-core/onnx", "crane/onnx"]
cuda = ["crane-core/cuda", "crane/cuda"]
rocm = ["crane-core/rocm", "crane/rocm"]
# Intel SYCL / oneAPI backend (proof-of-concept).
sycl = [
    "crane-core/sycl",
    "crane/sycl",
]
cudnn = ["crane-core/cudnn", "crane/cudnn"]
mkl = ["crane-core/mkl", "crane/mkl"]

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
