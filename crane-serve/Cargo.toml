[package]
name = "crane-serve"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "crane_serve"
path = "src/lib.rs"

[dependencies]
crane-core = { path = "../crane-core" }
crane = { path = "../crane" }
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tokenizers = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
reqwest = { version = "0.13", features = ["stream"] }
tempfile = "3"
image = "0.25"
base64 = "0.22"

[features]
metal = [
    "crane-core/metal",
    "crane/metal",
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]
accelerate = [
    "crane-core/accelerate",
    "crane/accelerate",
    "candle-core/accelerate",
    "candle-nn/accelerate",
    "candle-transformers/accelerate",
]
onnx = ["crane-core/onnx", "crane/onnx"]
cuda = ["crane-core/cuda", "crane/cuda"]
cudnn = ["crane-core/cudnn", "crane/cudnn"]
mkl = ["crane-core/mkl", "crane/mkl"]

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde_json = "1"
base64 = "0.22"
