[package]
name = "crane-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Micro-benchmark for the fused GDN recurrence kernel. No `required-features`:
# it needs `cuda` OR `rocm`, and that field is an AND — the binary itself
# refuses to run when neither is on.
[[bin]]
name = "gdn_bench"

# Micro-benchmark for the GPU top-k kernel. Same `required-features` caveat.
[[bin]]
name = "topk_bench"

# G2P hot-path performance benchmark (text_to_ipa, IpaNormalizer::normalize).
[[bench]]
name = "g2p"
harness = false
required-features = ["onnx"]

[dependencies]
ahash = "0.8"
anyhow = "1.0.97"

candle-nn = { workspace = true }
# TODO(candle-transformers-removal): See CANDLE_TRANSFORMERS.md for the
# remaining model/component and generation-helper call sites.
candle-transformers = { workspace = true }
clap = { version = "4.5.32", features = ["derive"] }
hf-hub = "0.5.0"
minijinja = { version = "2.21", features = ["builtins", "preserve_order"] }
minijinja-contrib = { version = "2.21", features = ["pycompat"] }
serde = "1.0"
# preserve_order: JSON object keys keep insertion order (matches Python's
# json.dumps / HF chat templates — needed for byte-identical tool rendering).
serde_json = { version = "1.0.140", features = ["preserve_order"] }
tokenizers = { workspace = true }
ribo = "0.1.3"
base64 = "0.22"
fancy-regex = "0.18"
tekken = { version = "0.2.0", default-features = false }
zip = "8"
fst = { workspace = true }
lru = { version = "0.12", optional = true }
aho-corasick = { version = "1", optional = true }
unicode-normalization = { version = "0.1", optional = true }


intel-mkl-src = { version = "0.8.1", optional = true }
accelerate-src = { version = "0.3.2", optional = true }
rustfft = "6"
image = "0.25"
half = "2"
prost = { version = "0.14.3", optional = true }

# candle-core = { workspace = true, features = ["accelerate"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
candle-core = { workspace = true, features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { workspace = true }

[features]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
    "dep:bindgen_cuda",
]
cudnn = ["candle-core/cudnn"]
# AMD ROCm/HIP backend (experimental). candle 0.11 on crates.io has no `rocm`
# feature, so this can't forward to `candle-core/rocm` yet.
rocm = []
# Intel SYCL / oneAPI backend (proof-of-concept). Forwards to the `sycl` feature
# of the candle fork wired in via `[patch.crates-io]` in the root Cargo.toml.
sycl = [
    "candle-core/sycl",
    "candle-nn/sycl",
    "candle-transformers/sycl",
]
mkl = [
    "dep:intel-mkl-src",
    "candle-core/mkl",
    "candle-nn/mkl",
    "candle-transformers/mkl",
]
accelerate = [
    "dep:accelerate-src",
    "candle-core/accelerate",
    "candle-nn/accelerate",
    "candle-transformers/accelerate",
]
onnx = ["dep:prost", "dep:prost-build", "dep:lru", "dep:aho-corasick", "dep:unicode-normalization"]
[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
hound = "3"

[build-dependencies]
bindgen_cuda = { version = "0.1.6", optional = true }
prost-build = { version = "0.14.3", optional = true }
