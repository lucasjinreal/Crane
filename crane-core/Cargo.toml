[package]
name = "crane-core"
version.workspace = true
description = "Core inference and multimodal primitives for Crane AI"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Micro-benchmark for the fused GDN recurrence kernel. No `required-features`:
# it needs `cuda` OR `rocm`, and that field is an AND — the binary itself
# refuses to run when neither is on.
[[bin]]
name = "gdn_bench"

# Micro-benchmark for the GPU top-k kernel. Same `required-features` caveat.
[[bin]]
name = "topk_bench"

[[bin]]
name = "ternary_bench"

# G2P hot-path performance benchmark (text_to_ipa, IpaNormalizer::normalize).
[[bench]]
name = "g2p"
harness = false
required-features = ["onnx"]

[dependencies]
ahash = "0.8"
anyhow = "1.0.97"

# Candle backend variants — see `src/candle_backend.rs`. Every variant,
# including the plain/stock one, is a *renamed* dependency on the underlying
# `candle-core`/`candle-nn`/`candle-transformers` package (`candle-core-default`,
# `candle-core-rocm`, `candle-core-sycl`, ...): none of them is ever a direct
# dependency literally named `candle-core` etc. `candle_backend.rs` is
# `include!`d at the crate root and rebinds whichever variant is active to the
# plain name `candle_core` — rustc refuses to let a macro/`include!`-expanded
# `extern crate` shadow a name Cargo already wired in via `--extern`, so if the
# *unrenamed* package were ever a direct dependency here, that rebinding would
# fail to compile the moment `rocm`/`sycl` was enabled. All three variants are
# `optional`, and the plain one is pulled in through `default-backend` (in
# `default`) rather than being unconditional, so a plain build (no backend
# feature at all) still gets a candle to link against.
candle-core-default = { workspace = true, optional = true }
candle-nn-default = { workspace = true, optional = true }
# TODO(candle-transformers-removal): See CANDLE_TRANSFORMERS.md for the
# remaining model/component and generation-helper call sites.
candle-transformers-default = { workspace = true, optional = true }

candle-core-sycl = { workspace = true, optional = true }
candle-nn-sycl = { workspace = true, optional = true }
candle-transformers-sycl = { workspace = true, optional = true }

candle-core-rocm = { workspace = true, optional = true }
candle-nn-rocm = { workspace = true, optional = true }
candle-transformers-rocm = { workspace = true, optional = true }
clap = { version = "4.5.32", features = ["derive"] }
hf-hub = { version = "1.0", features = ["blocking"] }
minijinja = { version = "2.21", features = ["builtins", "preserve_order"] }
minijinja-contrib = { version = "2.21", features = ["pycompat"] }
serde = "1.0"
# preserve_order: JSON object keys keep insertion order (matches Python's
# json.dumps / HF chat templates — needed for byte-identical tool rendering).
serde_json = { version = "1.0.140", features = ["preserve_order"] }
tokenizers = { workspace = true }
ribo = "0.1.3"
base64 = "0.23"
fancy-regex = "0.19"
tekken = { version = "0.2.0", default-features = false }
zip = "8"
fst = { workspace = true }
lru = { version = "0.18", optional = true }
memmap2 = "0.9"
aho-corasick = { version = "1", optional = true }
unicode-normalization = { version = "0.1", optional = true }


intel-mkl-src = { version = "0.8.1", optional = true }
accelerate-src = { version = "0.3.2", optional = true }
rustfft = "6"
image = "0.25"
half = "2"
prost = { version = "0.14.3", optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core-default = { workspace = true, optional = true, features = ["metal"] }
candle-nn-default = { workspace = true, optional = true, features = ["metal"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
candle-core-default = { workspace = true, optional = true, features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core-default = { workspace = true, optional = true }

[features]
# The plain/stock candle backend: CPU, plus whichever of `cuda`/`metal`/
# `accelerate`/`mkl`/`cudnn` is layered on top. In `default` so a plain build
# (no backend feature at all) still links a candle. `rocm`/`sycl` builds pull
# this in too (Cargo features are additive, and there is no way to say
# "default unless X"), but `candle_backend.rs` never rebinds `candle_core` to
# it when `rocm`/`sycl` is on, so it just sits unused — wasted compile time,
# not a correctness problem.
default = ["default-backend"]
default-backend = [
    "dep:candle-core-default",
    "dep:candle-nn-default",
    "dep:candle-transformers-default",
]
metal = [
    "candle-core-default/metal",
    "candle-nn-default/metal",
    "candle-transformers-default/metal",
]
cuda = [
    "candle-core-default/cuda",
    "candle-nn-default/cuda",
    "candle-transformers-default/cuda",
    "dep:bindgen_cuda",
]
cudnn = ["candle-core-default/cudnn"]
# AMD ROCm/HIP backend (experimental fork). Also enables the fork's own
# `rocm` feature — it's off by default there too. Build with
# `--no-default-features`: this crate's `default` feature pulls in the
# plain `candle-core`, which collides with this fork under the same name.
rocm = [
    "dep:candle-core-rocm",
    "dep:candle-nn-rocm",
    "dep:candle-transformers-rocm",
    "candle-core-rocm/rocm",
    "candle-nn-rocm/rocm",
    "candle-transformers-rocm/rocm",
]
# Intel oneAPI/SYCL backend (experimental fork). Same deal as `rocm` above,
# including the `--no-default-features` requirement.
sycl = [
    "dep:candle-core-sycl",
    "dep:candle-nn-sycl",
    "dep:candle-transformers-sycl",
    "candle-core-sycl/sycl",
    "candle-nn-sycl/sycl",
    "candle-transformers-sycl/sycl",
]
mkl = [
    "dep:intel-mkl-src",
    "candle-core-default/mkl",
    "candle-nn-default/mkl",
    "candle-transformers-default/mkl",
]
accelerate = [
    "dep:accelerate-src",
    "candle-core-default/accelerate",
    "candle-nn-default/accelerate",
    "candle-transformers-default/accelerate",
]
onnx = ["dep:prost", "dep:prost-build", "dep:lru", "dep:aho-corasick", "dep:unicode-normalization"]
[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
hound = "3"

[build-dependencies]
bindgen_cuda = { version = "0.1.6", optional = true }
prost-build = { version = "0.14.3", optional = true }
