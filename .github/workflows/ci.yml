name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format check
        run: cargo fmt --check
        continue-on-error: true
      - name: Clippy (pedantic)
        run: cargo clippy -- -W clippy::pedantic -D warnings
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc and ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev
      - name: Build (CPU)
        run: cargo build --release --features onnx
      - name: Test
        run: cargo test --workspace --features onnx
      - name: Download test data
        run: |
          pip install -U "huggingface_hub[cli]"
          hf download crane-local-ai/test-data --repo-type dataset --local-dir /tmp/crane-test-data
      - name: Test G2P fixtures from crane-local-ai/test-data
        run: |
          cargo test -p crane-core --features onnx --lib -- --ignored \
            models::g2p::lexicon::tests::test_tsv_fixture_lookups \
            models::kokoro_tts::ipa::tests::en_kokoro_normalizer_matches_reference_corpus
        env:
          CRANE_TEST_DATA_DIR: /tmp/crane-test-data
      - name: Download G2P dictionary (moonshine-g2p-en-us)
        run: python3 data/crane-model-download --model moonshine-g2p-en-us --path /tmp/crane-models
      - name: CER benchmark (no-OOV, rules tier only)
        run: |
          cargo test -p crane-core --features onnx --lib -- --ignored --nocapture \
            models::g2p::languages::english::tests::cer_benchmark_without_oov
        env:
          CRANE_G2P_EN_US_DIR: /tmp/crane-models/g2p/moonshine-g2p/en_us

  build-metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (Metal + Accelerate)
        run: cargo build --workspace --release --features "metal,accelerate"

  build-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
      - name: Install protoc and ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev
      - name: Build (CUDA)
        run: cargo build --release --features "cuda,onnx"
        env:
          # No GPU on this runner, so candle-kernels' build script can't
          # call nvidia-smi to auto-detect the compute capability.
          CUDA_COMPUTE_CAP: "80"
