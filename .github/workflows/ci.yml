name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (pedantic)
        run: cargo clippy -- -W clippy::pedantic -D warnings
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc and ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev
      - name: Build (CPU)
        run: cargo build --release --features onnx
      - name: Test
        run: cargo test --workspace --features onnx
      - name: Download test data
        run: |
          pip install -U "huggingface_hub[cli]"
          hf download crane-local-ai/test-data --repo-type dataset --local-dir /tmp/crane-test-data
      - name: Test G2P fixtures from crane-local-ai/test-data
        run: |
          cargo test -p crane-core --features onnx --lib -- --ignored \
            models::g2p::lexicon::tests::test_tsv_fixture_lookups \
            models::kokoro_tts::ipa::tests::en_kokoro_normalizer_matches_reference_corpus
        env:
          CRANE_TEST_DATA_DIR: /tmp/crane-test-data
      - name: Download G2P dictionary (g2p-lexicons)
        run: python3 data/crane-model-download --model g2p-lexicons --path /tmp/crane-models
      - name: CER benchmark (no-OOV, rules tier only)
        run: |
          cargo test -p crane-core --features onnx --lib -- --ignored --nocapture \
            models::g2p::languages::english::tests::cer_benchmark_without_oov
        env:
          CRANE_G2P_EN_US_DIR: /tmp/crane-models/g2p/g2p-lexicons/en_us

  build-metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (Metal + Accelerate)
        run: cargo build --workspace --release --features "metal,accelerate"

  build-cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
      - name: Install protoc and ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev
      - name: Build (CUDA)
        run: cargo build --release --features "cuda,onnx"
        env:
          # No GPU on this runner, so candle-kernels' build script can't
          # call nvidia-smi to auto-detect the compute capability.
          CUDA_COMPUTE_CAP: "80"

  build-sycl:
    # Intel's oneAPI apt repo (same one docker/sycl/Dockerfile.dev's base
    # image installs from). This runner has no Intel GPU, so this only
    # proves crane-core/kernels/sycl/*.cpp and the candle-*-sycl fork build
    # with icpx, not that they run — see README's "Intel GPU / SYCL"
    # section and docker/sycl/ for the driver/runtime side.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc and ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev
      - name: Install Intel oneAPI basekit (icpx, oneMKL, Level-Zero headers)
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-basekit
      - name: Source oneAPI environment
        # setvars.sh computes MKLROOT/CPATH/LIBRARY_PATH/etc. dynamically, so
        # they're captured here and passed to the next step via $GITHUB_ENV
        # rather than hardcoded (each `run:` step is a fresh shell).
        run: |
          source /opt/intel/oneapi/setvars.sh
          {
            echo "PATH=$PATH"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
            echo "LIBRARY_PATH=$LIBRARY_PATH"
            echo "CPATH=$CPATH"
            echo "MKLROOT=$MKLROOT"
            echo "ONEAPI_ROOT=$ONEAPI_ROOT"
          } >> "$GITHUB_ENV"
      - name: Build (SYCL)
        run: cargo build --release --no-default-features --features "sycl,onnx"

  build-rocm:
    # ROCm's apt repo only ships packages for jammy/noble; jammy is the
    # combination documented and exercised in practice (see README's
    # "AMD / ROCm" section) so pin it explicitly rather than ubuntu-latest.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc and ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libasound2-dev libclang-dev
      - name: Install ROCm (userspace libs only, no kernel driver)
        run: |
          wget https://repo.radeon.com/amdgpu-install/7.2.4/ubuntu/jammy/amdgpu-install_7.2.4.70204-1_all.deb
          sudo apt install -y ./amdgpu-install_7.2.4.70204-1_all.deb
          sudo apt update
          # This runner has no AMD GPU, so skip amdgpu-dkms: we only need
          # the HIP/ROCm userspace headers and libraries to link against.
          # miopen-hip-dev/rocrand-dev aren't pulled in by rocm-hip-sdk but
          # rocm-rs's build.rs unconditionally bindgens their headers too.
          sudo apt install -y rocm-hip-sdk miopen-hip-dev rocrand-dev
      - name: Build (ROCm)
        run: cargo build --release --no-default-features --features "rocm,onnx"
        env:
          ROCM_PATH: /opt/rocm
          HIP_PATH: /opt/rocm
          LD_LIBRARY_PATH: /opt/rocm/lib
