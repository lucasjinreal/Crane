[package]
name = "crane-ai"
version.workspace = true
description = "A Rust SDK for multimodal AI inference with Crane"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0"
colored = "3.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
thiserror = "2.0"
nvml-wrapper = { version = "0.13", optional = true }

crane-core = { version = "26.9.0", path = "../crane-core" }
hound = "3"
rubato = "5.0"
audioadapter-buffers = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokenizers = { workspace = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { workspace = true, features = ["metal"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
candle-core = { workspace = true, features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { workspace = true }

[features]
onnx = ["crane-core/onnx"]
metal = ["crane-core/metal", "candle-core/metal"]
accelerate = ["crane-core/accelerate", "candle-core/accelerate"]
cuda = ["crane-core/cuda", "dep:nvml-wrapper"]
# ROCm does not pull `nvml-wrapper` (NVIDIA-only telemetry, cuda-gated).
rocm = ["crane-core/rocm"]
cudnn = ["crane-core/cudnn"]
mkl = ["crane-core/mkl"]

[dev-dependencies]
tempfile = "3"

[lib]
name = "crane"
path = "src/lib.rs"
