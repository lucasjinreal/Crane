[package]
name = "crane-ai"
version.workspace = true
description = "A Rust SDK for multimodal AI inference with Crane"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0"
colored = "3.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
thiserror = "2.0"
nvml-wrapper = { version = "0.13", optional = true }

crane-core = { version = "26.9.0", path = "../crane-core", default-features = false }
hound = "3"
rubato = "5.0"
audioadapter-buffers = "5.0"
symphonia = { version = "0.5", features = ["mp3"] }
ribo = "0.1.3"
tokenizers = { workspace = true }

[features]
# See `crane-core/Cargo.toml`'s `default-backend` comment: `crane-core`'s own
# default is disabled above so `rocm` (built with `--no-default-features`)
# doesn't drag in crane-core's plain candle backend alongside the fork.
default = ["crane-core/default-backend"]
onnx = ["crane-core/onnx"]
metal = ["crane-core/metal"]
accelerate = ["crane-core/accelerate"]
cuda = ["crane-core/cuda", "dep:nvml-wrapper"]
# ROCm does not pull `nvml-wrapper` (NVIDIA-only telemetry, cuda-gated).
rocm = ["crane-core/rocm"]
# Intel SYCL / oneAPI backend (proof-of-concept).
sycl = ["crane-core/sycl"]
cudnn = ["crane-core/cudnn"]
mkl = ["crane-core/mkl"]

[dev-dependencies]
tempfile = "3"

[lib]
name = "crane"
path = "src/lib.rs"
