[package]
name = "crane"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0"
colored = "3.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
thiserror = "2.0"
nvml-wrapper = { version = "0.12", optional = true }

crane-core = { path = "../crane-core" }
hound = "3"
rubato = "4.0"
audioadapter-buffers = "4.0"
ribo = "0.1.3"
tokenizers = { workspace = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { workspace = true, features = ["metal"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
candle-core = { workspace = true, features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { workspace = true }

[features]
onnx = ["crane-core/onnx"]
metal = ["crane-core/metal", "candle-core/metal"]
accelerate = ["crane-core/accelerate", "candle-core/accelerate"]
cuda = ["crane-core/cuda", "dep:nvml-wrapper"]
# ROCm does not pull `nvml-wrapper` (NVIDIA-only telemetry, cuda-gated).
rocm = ["crane-core/rocm"]
# Intel SYCL / oneAPI backend (proof-of-concept).
sycl = ["crane-core/sycl", "candle-core/sycl"]
cudnn = ["crane-core/cudnn"]
mkl = ["crane-core/mkl"]

[dev-dependencies]
tempfile = "3"

[lib]
name = "crane"
path = "src/lib.rs"
